<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Protex PriceCraft | เข้าสู่ระบบศูนย์ควบคุม</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="login-page-backdrop" aria-label="หน้าต่างเข้าสู่ระบบ Protex Center">
        <section class="login-modal-card" id="loginModalCard">
            <button type="button" class="modal-close-x" id="btnCloseModal" title="ล้างข้อมูล / รีเซ็ต"
                aria-label="ปิดหน้าต่าง">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"
                    stroke-linejoin="round" aria-hidden="true">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>

            <div class="protex-logo-pill">
                <img src="ChatGPT Image 9 พ.ย. 2569 21_02_33.png" alt="PROTEX GROUP Logo" width="168" height="62">
            </div>

            <div class="gateway-tag">INTERNAL ACCESS GATEWAY</div>

            <h1 class="protex-center-title">Protex Center</h1>

            <p class="protex-center-subtitle">หจก.โพรเทคส์ แอคเซสโซรี อินดัสเตรียล</p>

            <form id="gatewayLoginForm" novalidate>
                <div class="emp-form-group">
                    <label class="emp-label" for="employeeIdInput">
                        รหัสประจำตัวพนักงาน (Employee ID)
                    </label>

                    <div class="emp-input-wrapper" id="empInputWrapper">
                        <span class="emp-badge-icon" aria-hidden="true">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1"
                                stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <rect x="5" y="2" width="14" height="20" rx="2" ry="2"></rect>
                                <line x1="10" y1="5" x2="14" y2="5"></line>
                                <circle cx="12" cy="11" r="2.2"></circle>
                                <path d="M8.5 17.5c0-1.8 1.6-3 3.5-3s3.5 1.2 3.5 3"></path>
                            </svg>
                        </span>

                        <input type="text" inputmode="text" id="employeeIdInput" class="emp-input"
                            placeholder="กรอกรหัสพนักงานที่ลงทะเบียนในระบบ" title="กรอกรหัสพนักงานที่ลงทะเบียนในระบบ"
                            autocomplete="username">
                    </div>

                    <div class="emp-error-hint" id="empErrorHint" role="alert">
                        รหัสประจำตัวพนักงานไม่ถูกต้อง กรุณาลองใหม่อีกครั้ง
                    </div>
                </div>

                <button type="submit" class="gateway-submit-btn" id="gatewaySubmitBtn">
                    <span>เข้าสู่ระบบศูนย์ควบคุม</span>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"
                        stroke-linejoin="round" aria-hidden="true">
                        <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
                        <polyline points="10 17 15 12 10 7"></polyline>
                        <line x1="15" y1="12" x2="3" y2="12"></line>
                    </svg>
                </button>
            </form>

        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/appwrite@14.0.1"></script>
    <script src="appwrite-config.js"></script>
    <script src="login.js"></script>
</body>

</html>
